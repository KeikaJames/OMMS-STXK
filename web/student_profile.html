<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>我的 · 社团选课</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css?v=22">
<script src="/js/legacy.js?v=18" defer></script>
<script src="/js/common.js?v=18" defer></script>
<script src="/js/profile.js?v=16" defer></script>
</head>
<body>
<div class="legacy-note" id="legacy" hidden>当前浏览器版本过低。请使用新版 Edge、Chrome 或 Firefox；使用 360、QQ、搜狗浏览器时请切换到极速模式。</div>
<a class="skip" href="#main">跳到主内容</a>
<header class="topbar">
  <a class="brand" href="/student/dashboard"><img src="/img/school-emblem.webp" alt="" width="34" height="34"><span><b>社团选课</b><small>鄂尔多斯市实验中学</small></span></a>
  <nav class="topnav" aria-label="主导航">
    <a href="/student/dashboard">选课</a>
    <a href="/student/profile" aria-current="page">我的</a>
    <button id="logout" type="button">退出</button>
  </nav>
</header>

<main class="page page-narrow" id="main">
  <div class="page-head"><h1>我的</h1></div>
  <div class="stack">
    <section class="card">
      <div class="pane-head"><h2>基本信息</h2></div>
      <dl class="facts">
        <dt>姓名</dt><dd id="f-name">—</dd>
        <dt>班级</dt><dd id="f-class">—</dd>
        <dt>学号</dt><dd class="mono" id="f-sid">—</dd>
        <dt>账号</dt><dd class="mono" id="f-user">—</dd>
      </dl>
    </section>

    <section class="card">
      <div class="pane-head"><h2>我的社团</h2></div>
      <p class="hint" id="reg-empty">暂无报名记录。<a href="/student/dashboard">前往报名</a></p>
      <div id="reg-detail" hidden>
        <h3 id="reg-name"></h3>
        <p class="hint" id="reg-time"></p>
      </div>
    </section>

    <section class="card">
      <div class="pane-head"><h2>修改密码</h2><p>修改后需重新登录。</p></div>
      <form id="password-form" novalidate>
        <div class="field"><label for="cp">当前密码</label><input class="input" id="cp" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="np">新密码（至少 6 位）</label><input class="input" id="np" type="password" autocomplete="new-password"></div>
        <div class="field"><label for="np2">确认新密码</label><input class="input" id="np2" type="password" autocomplete="new-password"></div>
        <p class="error" id="password-error" role="alert"></p>
        <button class="btn btn-primary" id="save" type="submit">保存</button>
      </form>
    </section>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<footer class="foot">Designed by Gabiri · © Weilesi</footer>
</body>
</html>
