<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>选课主页 · 鄂尔多斯市实验中学社团选课</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/img/editorial-grassland.jpg" as="image" fetchpriority="high">
<link rel="stylesheet" href="/app.css?v=8">
<link rel="stylesheet" href="/motion.css">
<script>(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var h=document.documentElement;h.classList.add('motion');setTimeout(function(){h.classList.remove('motion')},1600)}})();</script>
<script src="/vendor/gsap.min.js" defer></script>
<script src="/vendor/confetti.min.js" defer></script>
<script src="/motion.js" defer></script>
<script src="/easter-egg.js" defer></script>
<script src="/student-dashboard.js?v=8" defer></script>
</head>
<body class="page-student">
<a class="skip" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="brand">
    <img class="mark" src="/img/school-emblem.jpg" alt="鄂尔多斯市实验中学校徽" width="42" height="42">
    <span class="t"><b>鄂尔多斯市实验中学</b><small>社团选课</small></span>
  </div>
  <nav class="topnav" aria-label="主导航">
    <a href="/student/dashboard" class="active" aria-current="page">选课</a>
    <a href="/student/profile">个人信息</a>
    <button id="logout" type="button">退出</button>
  </nav>
</header>

<main class="student-store" id="main">
  <section class="store-hero" aria-labelledby="page-title">
    <div class="hero-copy">
      <h1 id="page-title">every choice matters</h1>
      <p>Our choices are the hinges of destiny</p>
    </div>
    <div class="state-media" id="state-media" data-state="loading" aria-hidden="true">
      <img id="state-image" src="/img/editorial-desk.jpg" alt="" width="1400" height="787" fetchpriority="high" decoding="async">
    </div>
  </section>

  <section class="status-section" aria-labelledby="status-h">
    <h2 id="status-h" class="sr-only">选课状态</h2>
    <div class="status" id="statusbar">
      <div class="status-lead">
        <span class="status-kicker">报名状态</span>
        <span class="lab"><span class="dot" aria-hidden="true"></span><strong id="status-text">正在载入</strong></span>
        <p id="status-detail">正在读取开放时间与报名信息</p>
      </div>
      <div class="status-time">
        <span class="status-kicker" id="clock-label">当前时间</span>
        <span class="clock num" id="clock" aria-live="off"></span>
      </div>
      <div class="status-rule-block">
        <span class="status-kicker">选课规则</span>
        <p class="rule">每人 <b>限选 1 个</b> 项目<br>退选后可以重新选择</p>
      </div>
    </div>
    <div class="sync-state" id="sync-state" role="status" aria-live="polite" hidden>
      <span class="sync-spinner" aria-hidden="true"></span>
      <span>请求已经提交，正在确认服务端最终结果。请不要重复操作。</span>
    </div>
  </section>

  <section class="offerings" aria-labelledby="clubs-h">
    <div class="section-h store-section-h">
      <div>
        <h2 id="clubs-h">本学期选修项目</h2>
        <p id="hint">每人可选择 1 个项目</p>
      </div>
      <span id="updated-at" class="updated-at num" aria-live="off"></span>
    </div>
    <div class="clubs" id="clubs" aria-busy="true">
      <div class="sk sk-club"></div>
      <div class="sk sk-club"></div>
      <div class="sk sk-club"></div>
    </div>
  </section>

  <div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <p class="foot">Designed By Gabira</p>
</main>
</body>
</html>
