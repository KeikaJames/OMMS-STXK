<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>选课 · 社团选课</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css?v=18">
<script src="/js/legacy.js?v=18" defer></script>
<script src="/js/common.js?v=18" defer></script>
<script src="/js/student.js?v=18" defer></script>
</head>
<body>
<div class="legacy-note" id="legacy" hidden>这个浏览器版本太旧，打不开选课页面。请换用新版 Edge、Chrome 或 Firefox；360、QQ、搜狗浏览器请点地址栏右侧的图标切换到“极速模式”。</div>
<a class="skip" href="#main">跳到主内容</a>
<header class="topbar">
  <a class="brand" href="/student/dashboard"><img src="/img/school-emblem.webp" alt="" width="34" height="34"><span><b>社团选课</b><small>鄂尔多斯市实验中学</small></span></a>
  <nav class="topnav" aria-label="主导航">
    <a href="/student/dashboard" aria-current="page">选课</a>
    <a href="/student/profile">我的</a>
    <button id="logout" type="button">退出</button>
  </nav>
</header>

<main class="page" id="main">
  <section class="intro">
    <div>
      <p class="eyebrow" id="greeting">本学期社团</p>
      <h1>选一个想去的社团</h1>
      <p class="lede">每人可以报名一个社团，退选后可以重新选择。</p>
    </div>
    <img class="intro-art" src="/img/hero-grassland.webp" alt="" width="960" height="541" decoding="async">
  </section>

  <section class="status" id="status" data-phase="loading" aria-live="polite">
    <div class="status-main">
      <strong><span class="dot" aria-hidden="true"></span><span id="status-title">正在读取</span></strong>
      <span id="status-detail">正在同步开放时间与名额</span>
    </div>
    <div class="status-clock"><small id="clock-label">当前时间</small><span class="clock" id="clock">--:--:--</span></div>
  </section>

  <section class="card mine" id="mine" hidden>
    <div>
      <p class="eyebrow">我的社团</p>
      <h2 id="mine-name"></h2>
      <p id="mine-meta"></p>
    </div>
    <div class="mine-actions" id="mine-actions"></div>
  </section>

  <section aria-labelledby="catalog-title">
    <div class="section-title"><h2 id="catalog-title">全部社团</h2><p id="updated-at"></p></div>
    <div class="toolbar">
      <label class="sr-only" for="search">搜索社团</label>
      <input class="input" id="search" type="search" placeholder="搜索社团、老师或地点" autocomplete="off">
      <div class="chips" role="group" aria-label="筛选">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="chip" type="button" data-filter="eligible" aria-pressed="false">我能报名</button>
        <button class="chip" type="button" data-filter="open" aria-pressed="false">还有名额</button>
        <button class="chip" type="button" data-filter="fav" aria-pressed="false">收藏</button>
      </div>
    </div>
    <div class="club-grid" id="clubs" aria-busy="true">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<footer class="foot">Designed by Gabiri · © Weilesi</footer>
</body>
</html>
