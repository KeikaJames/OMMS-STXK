<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>登录 · 社团选课</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css?v=17">
<script src="/js/common.js?v=17" defer></script>
<script src="/js/login.js?v=15" defer></script>
</head>
<body class="login-body">
<main class="card login-card">
  <div class="login-head">
    <img src="/img/school-emblem.webp" alt="鄂尔多斯市实验中学校徽" width="56" height="56">
    <h1>社团选课</h1>
    <p>鄂尔多斯市实验中学</p>
  </div>
  <div class="seg" role="group" aria-label="登录身份">
    <button type="button" data-role="student" aria-pressed="true">学生</button>
    <button type="button" data-role="admin" aria-pressed="false">管理员</button>
  </div>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="username">用户名</label>
      <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
  </form>
  <p class="login-foot">建议开放前几分钟登录 · 忘记密码请联系班主任重置</p>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
