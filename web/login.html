<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161B24">
<title>登录 · 鄂尔多斯市实验中学社团选课</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/motion.css">
<script>(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var h=document.documentElement;h.classList.add('motion');setTimeout(function(){h.classList.remove('motion')},1600)}})();</script>
<script src="/vendor/gsap.min.js" defer></script>
<script src="/vendor/vanilla-tilt.min.js" defer></script>
<script src="/motion.js" defer></script>
<script src="/easter-egg.js" defer></script>
</head>
<body class="home">
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="glassdistort" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="7" result="n"/><feGaussianBlur in="n" stdDeviation="1.4" result="sn"/><feDisplacementMap in="SourceGraphic" in2="sn" scale="11" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main class="home-main">
  <div style="width:100%;max-width:380px" id="cardwrap">
    <div class="card m-in" id="card">
      <div class="home-head" style="text-align:center;margin-bottom:20px">
        <img class="m-in" src="/favicon.svg" width="46" height="46" alt="" style="border-radius:11px">
        <h1 id="title" class="m-in" style="font-size:21px;color:var(--ink);margin-top:10px;font-weight:600">社团选课</h1>
        <p class="mono m-in" style="color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:1.4px">鄂尔多斯市实验中学</p>
      </div>
      <div class="seg m-in" id="seg">
        <button class="on" data-type="student" type="button">学生登录</button>
        <button data-type="admin" type="button">管理员</button>
      </div>
      <div class="field m-in">
        <label for="u">用户名</label>
        <input class="input" id="u" autocomplete="username" placeholder="请输入用户名">
      </div>
      <div class="field m-in">
        <label for="p">密码</label>
        <input class="input" id="p" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <div style="margin:2px 2px 18px" class="m-in">
        <span style="font-size:12px;color:var(--muted)">密码遗失,请联系班主任或管理员重置</span>
      </div>
      <p id="err" style="color:var(--danger);font-size:13px;min-height:0;margin:0 2px 12px"></p>
      <button class="btn btn-primary btn-block m-in" id="go" type="button">登录</button>
    </div>
  </div>
  <p class="foot" style="position:absolute;left:0;right:0;bottom:18px;margin:0">Designed by Gabiri &middot; &copy; Weilesi</p>
</main>
<script>
const $ = s => document.querySelector(s);
const M = () => window.Motion;   // motion.js 为 defer 加载,调用时再取
let kind = 'student';
let segPlace = null;
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#seg').children].forEach(x => x.classList.toggle('on', x === b));
  kind = b.dataset.type;
  if (segPlace) segPlace(true);
});
function fail(m){
  const e = $('#err'); e.textContent = m;
  if (m && M()){ M().shake($('#cardwrap')); M().flash(e); }
}
async function go(){
  const btn = $('#go'); if (btn.disabled) return;
  const u = $('#u').value.trim(), p = $('#p').value;
  if (!u || !p){ fail('请输入用户名和密码'); return; }
  fail('');
  btn.disabled = true; const txt = btn.textContent;
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span>';
  try{
    const r = await fetch(kind === 'student' ? '/api/login' : '/api/admin_login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p})
    });
    if (r.status === 429 || r.status === 503){
      const retry = Math.max(1, parseInt(r.headers.get('Retry-After') || '1', 10) || 1);
      let d = null; try { d = await r.json(); } catch(e) {}
      fail((d && d.message) || ('登录繁忙,请在 '+retry+' 秒后重试'));
      btn.disabled = false; btn.textContent = txt;
      return;
    }
    const d = await r.json();
    if (d.success){
      const url = kind === 'student' ? '/student/dashboard' : '/admin/dashboard';
      if (M()) M().exitTo(url, $('#card')); else location.href = url;
      return;
    }
    fail(d.message || '登录失败,请重试');
  }catch(e){ fail('网络错误,请重试'); }
  btn.disabled = false; btn.textContent = txt;
}
$('#go').addEventListener('click', go);
$('#p').addEventListener('keyup', e => { if (e.key === 'Enter') go(); });
$('#u').addEventListener('keyup', e => { if (e.key === 'Enter') $('#p').focus(); });

function boot(){
  const m = M(); if (!m) return;
  m.spotlight();
  segPlace = m.segThumb($('#seg'));
  const tl = m.loginIntro($('#card'), '#card .m-in:not(#title)', $('#title'));
  if (tl) tl.eventCallback('onComplete', () => m.tilt($('#card'))); else m.tilt($('#card'));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
</html>
