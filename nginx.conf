# 选课系统 nginx 边缘配置(dev:listen 8080 免 root;prod 改 443 ssl)
# 作用:限流(等候室)/ 静态卸载 / TLS 终止 / 把 6 个热端点路由到 Rust,其余到 Python。
# 用法:见 run.sh —— 它把 __APP_ROOT__ 替换为实际仓库路径后再启动 nginx(便于任意位置克隆)。
worker_processes auto;
worker_shutdown_timeout 15s;
error_log /tmp/club_nginx_error.log warn;
pid /tmp/club_nginx.pid;

events { worker_connections 4096; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format upstream_timing '$remote_addr "$request" $status '
                               'upstream=$upstream_addr upstream_status=$upstream_status '
                               'connect=$upstream_connect_time header=$upstream_header_time '
                               'response=$upstream_response_time request=$request_time '
                               'limit_req=$limit_req_status limit_conn=$limit_conn_status';
    access_log    /tmp/club_nginx_access.log upstream_timing buffer=64k flush=1s;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 只有标准 43 字符 base64url token 才进入 session 桶；空值/畸形值回落 IP。
    # 这只是正常浏览器防狂点层，不代表 Nginx 已验证 session 身份；攻击者可
    # 轮换形状正确的伪 Cookie，所以热路径还必须同时受真实源 IP 桶约束。
    map $cookie_session $student_limit_key {
        "~^[A-Za-z0-9_-]{43}$" $cookie_session;
        default              $binary_remote_addr;
    }
    map $status $retry_after {
        429     1;
        default "";
    }
    # 校园通常共享公网 IP；合法学生按 session 隔离，并另设不可绕过的全站总量桶。
    limit_req_zone  $student_limit_key zone=student:10m rate=8r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=hotip:10m rate=250r/s;
    limit_req_zone  $server_name zone=global:1m rate=5000r/s;
    limit_req_status 429;
    limit_conn_zone $student_limit_key zone=persession:10m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # 热路径:首选 Rust(:2002),Rust 不可用自动回落 Python(:2001)backup —— 路由级秒级回滚。
    # keepalive 属于整个 upstream 组，Python backup 也会复用该池；这依赖
    # Python 已在每条 POST 路径完整 drain body 或明确关闭连接。只有下面独立的
    # club_admin 管理 upstream 被刻意配置为不复用。
    upstream club_hot {
        server 127.0.0.1:2002 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:2001 backup;
        keepalive 64;
    }
    # 管理面吞吐不是瓶颈；不复用 Python upstream 连接可作为应用层 framing
    # 防护之外的纵深保护，避免今后早退路径回归时跨请求污染。
    upstream club_admin { server 127.0.0.1:2001; }

    server {
        listen 8080;
        server_name _;
        root __APP_ROOT__/web;
        client_max_body_size 8m;

        # These headers cover dynamic responses, static resources, and Nginx
        # errors. Inline scripts/styles remain only for the migration-compatible
        # CSP; move them to hashed external files before removing unsafe-inline.
        # HSTS belongs solely in the real TLS server below, never on this HTTP
        # listener used by development and the isolated assessment stack.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
        add_header Retry-After $retry_after always;

        # 静态页/资源:nginx 直发(从应用卸载,开放瞬间不打 Python/Rust)
        location = /                  { try_files /login.html =404; }
        location = /student/dashboard { try_files /student_dashboard.html =404; }
        location = /student/profile   { try_files /student_profile.html =404; }
        location = /admin/dashboard   { try_files /admin_dashboard.html =404; }
        location ~* \.(html|css|js|png|jpe?g|gif|svg|ico|woff2?|mp4)$ {
            try_files $uri =404;
            expires 5m;
        }

        # 登录峰值单独设 IP 桶；应用内 Argon2 semaphore 仍是资源保险。
        location = /api/login {
            limit_req zone=login burst=300 nodelay;
            limit_req zone=global burst=10000 nodelay;
            client_max_body_size 4k;
            proxy_pass http://club_hot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout;
        }

        # 管理员登录走 Python，仍使用与学生登录相同的边缘资源上限。
        location = /api/admin_login {
            limit_req zone=login burst=300 nodelay;
            limit_req zone=global burst=10000 nodelay;
            client_max_body_size 4k;
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_send_timeout 5s;
        }

        # 学生热路径按 session 限速；正则锚定结尾，避免相似路径误路由。
        location ~ ^/api/(register_club|cancel_registration|get_clubs|check_registration_time|get_student_info)$ {
            limit_req zone=student burst=12 nodelay;
            limit_req zone=hotip burst=1000 nodelay;
            limit_req zone=global burst=10000 nodelay;
            limit_conn persession 4;
            limit_conn perip 1024;
            client_max_body_size 4k;
            proxy_pass http://club_hot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout;
        }

        location = /healthz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://club_hot/healthz;
        }
        location = /readyz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://club_hot/readyz;
        }

        # 其余 API(管理面)与未匹配路径 -> Python(:2001)
        location / {
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 生产 TLS(取消注释并配置证书):
    # server {
    #     listen 443 ssl http2;
    #     ssl_certificate     /path/fullchain.pem;
    #     ssl_certificate_key /path/privkey.pem;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     # Also set COOKIE_SECURE=1 for both backends in the TLS service unit.
    #     ... 同上 location ...
    # }
}
