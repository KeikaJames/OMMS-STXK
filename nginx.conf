# 选课系统 nginx 边缘配置。run.sh 把 __APP_ROOT__、__RUN_DIR__ 替换为实际路径后启动。
# 作用：静态资源直发、限流、名额快照微缓存、压缩，热接口转给 Rust(:2002)，其余转给 Python(:2001)。
worker_processes auto;
worker_rlimit_nofile 16384;
worker_shutdown_timeout 15s;
error_log __RUN_DIR__/nginx-error.log warn;
pid __RUN_DIR__/nginx.pid;

events { worker_connections 4096; }

http {
    types {
        text/html                html;
        text/css                 css;
        application/javascript   js;
        application/json         json;
        image/svg+xml            svg;
        image/png                png;
        image/jpeg               jpg jpeg;
        image/webp               webp;
        image/gif                gif;
        image/x-icon             ico;
        font/woff2               woff2;
        font/woff                woff;
        video/mp4                mp4;
    }
    default_type  application/octet-stream;
    # 访问日志只记录固定字段，供管理后台的运行快照使用。
    # run.sh 在 nginx 1.17.6 以前的版本上去掉 limit_req、limit_conn 两个字段。
    log_format upstream_timing 'ts=$msec status=$status upstream="$upstream_addr" request_time=$request_time limit_req=$limit_req_status limit_conn=$limit_conn_status';
    access_log    __RUN_DIR__/nginx-access.log upstream_timing buffer=64k flush=1s;
    # 临时目录放在运行目录里，普通用户也能启动。
    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path       __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path     __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path       __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path        __RUN_DIR__/nginx-scgi;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 形状正确的 session 进入会话桶，其余按来源 IP；另有不依赖 Cookie 的 IP 桶与全站总量桶。
    map $cookie_session $student_limit_key {
        "~^[A-Za-z0-9_-]{43}$" $cookie_session;
        default              $binary_remote_addr;
    }
    # nginx 自己返回的 429、503 带 Retry-After: 1；后端已经给出等待秒数时原样转发，不再重复添加。
    map $status:$upstream_http_retry_after $retry_after {
        "~^(429|503):$" 1;
        default         "";
    }
    limit_req_zone  $student_limit_key zone=student:10m rate=8r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=hotip:10m rate=250r/s;
    limit_req_zone  $binary_remote_addr zone=pollip:10m rate=2000r/s;
    limit_req_zone  $binary_remote_addr zone=imageip:10m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=adminimage:10m rate=2r/s;
    limit_req_zone  $server_name zone=global:1m rate=5000r/s;
    limit_req_status 429;
    limit_conn_zone $student_limit_key zone=persession:10m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # 名额快照与社团目录对所有学生相同，缓存 1 秒：后端每秒只生成一次。
    proxy_cache_path __RUN_DIR__/nginx-cache levels=1 keys_zone=snapshot:1m max_size=16m
                     inactive=30s use_temp_path=off;

    # 热接口首选 Rust，Rust 不可用时自动转到 Python；只跑 Python 时 run.sh 去掉 2002 和 keepalive。
    upstream club_hot {
        server 127.0.0.1:2002 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:2001 backup;
        keepalive 64;
    }
    upstream club_admin { server 127.0.0.1:2001; }

    server {
        listen 8080 backlog=2048;
        server_name _;
        root __APP_ROOT__/web;
        client_max_body_size 8m;

        # 设置 TLS_CERT、TLS_KEY 后，run.sh 改为在 TLS_PORT 上提供 HTTPS 并加入 HSTS，8080 跳转到 HTTPS。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'" always;
        add_header Retry-After $retry_after always;

        error_page 429 = @rate_limited;
        error_page 502 504 = @unavailable;
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"code":"rate_limited","message":"请稍等片刻再试"}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"success":false,"code":"unavailable","message":"请稍后再试"}';
        }

        location = /                  { try_files /login.html =404; }
        location = /student/dashboard { try_files /student_dashboard.html =404; }
        location = /admin/dashboard   { try_files /admin_dashboard.html =404; }
        # 社团图片只经 Python 的白名单与路径校验对外提供，放在通用静态规则之前。
        location ^~ /club-images/ {
            limit_req zone=imageip burst=120 nodelay;
            limit_req zone=global burst=10000 nodelay;
            limit_conn perip 64;
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # 脚本与样式的地址带版本号，可以长时间缓存；页面每次重新校验。
        location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|mp4)$ {
            try_files $uri =404;
            expires 7d;
        }
        location ~* \.html$ {
            try_files $uri =404;
            expires -1;
        }

        location = /api/login {
            limit_req zone=login burst=300 nodelay;
            limit_req zone=global burst=10000 nodelay;
            client_max_body_size 4k;
            proxy_pass http://club_hot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout;
        }

        location = /api/admin_login {
            limit_req zone=login burst=300 nodelay;
            limit_req zone=global burst=10000 nodelay;
            client_max_body_size 4k;
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_send_timeout 5s;
        }

        location = /api/upload_club_image {
            limit_req zone=adminimage burst=4 nodelay;
            limit_req zone=global burst=10000 nodelay;
            limit_conn perip 4;
            client_max_body_size 10m;
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        # 名单表格与备份文件上传，由 Python 处理。
        location = /api/admin/import/parse {
            limit_req zone=adminimage burst=4 nodelay;
            limit_req zone=global burst=10000 nodelay;
            client_max_body_size 10m;
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
        }
        location = /api/admin/restore_upload {
            limit_req zone=adminimage burst=4 nodelay;
            limit_req zone=global burst=10000 nodelay;
            client_max_body_size 64m;
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # 名额快照与社团目录：nginx 缓存 1 秒，并按 ETag 返回 304。
        location ~ ^/api/(seats|catalog)$ {
            limit_req zone=student burst=20 nodelay;
            limit_req zone=pollip burst=4000 nodelay;
            proxy_pass http://club_hot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache snapshot;
            proxy_cache_key $uri;
            # 浏览器仍按 no-cache 每次校验 ETag；nginx 自己缓存 1 秒。
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_background_update on;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout;
        }

        # 分批报名的批次与时段：Python 提供，nginx 同样缓存 1 秒；批次切换时全体学生同时读取。
        location = /api/batches {
            limit_req zone=student burst=20 nodelay;
            limit_req zone=pollip burst=4000 nodelay;
            proxy_pass http://club_admin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache snapshot;
            proxy_cache_key $uri;
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_background_update on;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }

        # 学生热接口按会话限速；正则锚定结尾。
        location ~ ^/api/(register_club|cancel_registration|get_clubs|check_registration_time|get_student_info)$ {
            limit_req zone=student burst=12 nodelay;
            limit_req zone=hotip burst=1000 nodelay;
            limit_req zone=global burst=10000 nodelay;
            limit_conn persession 4;
            limit_conn perip 1024;
            client_max_body_size 4k;
            proxy_pass http://club_hot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout;
        }

        location = /healthz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://club_hot/healthz;
        }
        location = /readyz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://club_hot/readyz;
        }

        # 管理接口与其余路径 -> Python(:2001)
        location / {
            proxy_pass http://club_admin;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
